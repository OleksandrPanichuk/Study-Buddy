services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: study-buddy-postgres
    environment:
      - POSTGRES_DB=study_buddy_db
      - POSTGRES_USER=study_buddy_user
      - POSTGRES_PASSWORD=study_buddy_password
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - study-buddy-network

  redis:
    image: redis:latest
    container_name: study-buddy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - study-buddy-network
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: study-buddy-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123456
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - study-buddy-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  api:
    build:
      context: .
      dockerfile: apps/docker/Dockerfile.api
    container_name: study-buddy-api
    working_dir: /app
    command: sh -c "bun install --frozen-lockfile && cd apps/backend && bun run db:generate && bun run dev"
    env_file:
      - ./apps/backend/.env
    environment:
      - PORT=8080
      - BASE_URL=http://localhost:8080
      - WEB_URL=http://localhost:3000
      - DATABASE_URL=postgresql://study_buddy_user:study_buddy_password@postgres:5432/study_buddy_db
      - REDIS_URL=redis://redis:6379
      - AWS_S3_ENDPOINT=http://minio:9000
      - SENTRY_ENABLE_PROFILING=false
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=1000
      - WATCHPACK_POLLING=true
      - WATCHPACK_POLLING_INTERVAL=1000
      - TSC_WATCHFILE=UsePolling
      - TSC_WATCHDIRECTORY=UsePolling
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - backend_node_modules:/app/apps/backend/node_modules
      - web_node_modules:/app/apps/web/node_modules
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
      - minio
    networks:
      - study-buddy-network

  web:
    build:
      context: .
      dockerfile: apps/docker/Dockerfile.web
    container_name: study-buddy-web
    working_dir: /app
    command: sh -c "echo 'Waiting for web dependencies...' && while [ ! -x /app/apps/web/node_modules/.bin/vite ]; do sleep 1; done && cd apps/web && bun run dev --host 0.0.0.0 --port 3000"
    env_file:
      - ./apps/web/.env
    environment:
      - VITE_APP_URL=http://localhost:3000
      - VITE_API_URL=http://localhost:8080
      - INTERNAL_API_URL=http://api:8080
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - web_node_modules:/app/apps/web/node_modules
    ports:
      - "3000:3000"
    networks:
      - study-buddy-network

networks:
  study-buddy-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  node_modules:
  backend_node_modules:
  web_node_modules:
